services:
  backend:
    build:
      context: ./backend
    container_name: jsonfusion-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - jsonfusion-net
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: jsonfusion-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - jsonfusion-net

networks:
  jsonfusion-net:
    name: jsonfusion-net